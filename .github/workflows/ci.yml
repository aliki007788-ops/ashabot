name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api   # اختیاری ولی تمیزتر

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .          # چون lockfile در root است

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      - name: TypeScript check
        run: npx tsc --noEmit

      # پیشنهادهای اضافه (اختیاری ولی مفید):
      # - name: Lint
      #   run: pnpm lint

      # - name: Unit tests
      #   run: pnpm test
