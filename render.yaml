services:
  - type: web
    name: ashabot-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bot-platform/api build
    startCommand: pnpm --filter @bot-platform/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: ashabot-db
          property: connectionString
      - key: REDIS_URL
        value: "redis://localhost:6379"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: ashabot-db
    plan: free
    databaseName: ashabot
    user: ashabot
