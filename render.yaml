services:
  - type: web
    name: ashabot-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bot-platform/api build
    startCommand: pnpm --filter @bot-platform/api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      # آدرس دیتابیس (Supabase/Neon/...) را فقط داخل داشبورد Render وارد کنید
      - key: DATABASE_URL
        sync: false
      # ایمیل مدیر (با کاما جدا کنید): کاربری که با این ایمیل ثبت‌نام/ورود کند «ادمین» می‌شود
      - key: ADMIN_EMAILS
        sync: false
      # ارسال ایمیل بازیابی رمز (اختیاری، resend.com)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # آدرس دقیق فرانت روی ورسل (چند آدرس را با کاما جدا کنید) یا * برای همه
      - key: CORS_ORIGIN
        value: "*"
      # آدرس فرانت (برای بازگشت از درگاه پرداخت)
      - key: FRONTEND_URL
        sync: false
      # آدرس عمومی همین API (مثلاً https://ashabot-api.onrender.com)
      - key: PUBLIC_API_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: ZARINPAL_SANDBOX
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

# دیتابیس: اینجا تعریف نشده (Supabase/Neon). DATABASE_URL را در داشبورد Render وارد کنید.
