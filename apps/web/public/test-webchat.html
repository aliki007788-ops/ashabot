<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست WebChat Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .info {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: right;
    }

    .info h3 {
      margin-bottom: 12px;
      font-size: 1.1rem;
    }

    .info ul {
      list-style: none;
    }

    .info li {
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info li::before {
      content: '✓';
      color: #4ade80;
      font-weight: bold;
    }

    .hint {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,215,0,0.2);
      border: 1px solid rgba(255,215,0,0.4);
      border-radius: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 تست WebChat</h1>
    <p>ویجت چت باید در گوشه پایین چپ ظاهر شود</p>

    <div class="info">
      <h3>🎯 چه چیزی باید ببینید:</h3>
      <ul>
        <li>دکمه شناور با آیکون 💬 در پایین چپ</li>
        <li>با کلیک، پنجره چت باز می‌شود</li>
        <li>عنوان: "پشتیبانی آنلاین"</li>
        <li>رنگ: بنفش/آبی</li>
        <li>شما می‌توانید پیام بفرستید</li>
      </ul>
    </div>

    <div class="hint">
      💡 اگر دکمه چت را نمی‌بینید، F12 را بزنید و خطاهای Console را چک کنید
    </div>
  </div>

  <!-- WebChat Widget -->
  <script 
    src="http://localhost:3000/webchat.js" 
    data-bot-id="cmuu13l3q000guujzqgic5zat"
    data-api-url="http://localhost:4000"
    data-color="#6a8dff"
    data-title="پشتیبانی آنلاین"
    data-subtitle="معمولاً سریع پاسخ می‌دهیم"
    data-position="bottom-left"
    async
  ></script>
</body>
</html>
